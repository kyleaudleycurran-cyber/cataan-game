name: Test game
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test game rules and multiplayer server
        run: npm test
      - name: Install browser test tools
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise the browser game with two players
        run: node tests/browser-smoke.mjs
      - name: Save browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-captures
          path: test-artifacts/
          if-no-files-found: ignore
